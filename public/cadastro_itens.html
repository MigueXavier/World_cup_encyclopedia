<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Enciclopédia de Copas</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/cadastro_itens.css">
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1 class="admin-title">PAINEL <span>ADMIN</span></h1>
        <a href="index.html" class="btn-back">❮ Voltar para Home</a>
    </div>

    <!-- Seletor de tipo -->
    <div class="type-tabs" id="typeTabs">
        <button class="type-tab active" data-type="copas">🏆 Copas</button>
        <button class="type-tab" data-type="jogadores">⚽ Jogadores</button>
        <button class="type-tab" data-type="times">🛡️ Times</button>
        <button class="type-tab" data-type="jogos">🎮 Jogos Históricos</button>
    </div>

  
    <div class="form-panel">
        <p class="form-panel-title" id="formPanelTitle">Adicionar novo item</p>
        <input type="hidden" id="txtId">
        <div class="form-grid" id="formFields"></div>
        <div class="form-actions">
            <button class="btn-save" id="btnSubmit" onclick="salvarItem()">Salvar</button>
            <button class="btn-clear" onclick="limparFormulario()">Cancelar</button>
        </div>
    </div>

   
    <p class="table-section-title" id="tableSectionTitle">Itens cadastrados</p>
    <div class="table-wrapper">
        <table class="admin-table">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="../assets/js/crud.js"></script>
</body>
</html>

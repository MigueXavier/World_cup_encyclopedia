<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="main-header">
    <div class="left-section">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="logo-container">
            <img src="https://s2-ge.glbimg.com/RGU5LEYpvpcPRro8r9wxAEvmltU=/0x0:2048x2048/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_bc8228b6673f488aa253bbcb03c80ec5/internal_photos/bs/2023/q/Q/e3U1thRemgE9lEG0J4gQ/logo-fifa.jpg" alt="FIFA Logo">
        </div>
    </div>
</header>

<main>
    <div class="image-wrapper">

        <div class="image-overlay" id="image-overlay"></div>
        <img src="https://upload.wikimedia.org/wikipedia/pt/d/d7/Logo_copa_2026.png" alt="World Cup 2026 Logo" id="main-image">
    </div>
    <div class="text-section">
        <h1>World Cup <span class="year">2026</span></h1>
        <p id="country-text">Selecione um país para conhecer sua história na Copa do Mundo.</p>
    </div>
</main>

<section id="country-section">
    <div class="country-ball">
        
        <button class="country-button" id="brasil">
            <img src="https://flagicons.lipis.dev/flags/4x3/br.svg" alt="Brasil">
        </button>
        <span class="country-label">Brasil</span>
    </div>
    <div class="country-ball">
        <button class="country-button" id="alemanha">
            <img src="https://flagicons.lipis.dev/flags/4x3/de.svg" alt="Alemanha">
        </button>
        <span class="country-label">Alemanha</span>
    </div>
    <div class="country-ball">
  
        <button class="country-button" id="franca">
            <img src="https://flagicons.lipis.dev/flags/4x3/fr.svg" alt="França">
        </button>
        <span class="country-label">França</span>
    </div>
</section>



<section id="encyclopedia-section">

    <div class="enc-header">
        <h2 class="enc-title">Enciclopédia</h2>
        <p class="enc-subtitle">Jogadores, edições, times e jogos históricos</p>
    </div>

    <div class="enc-toolbar">
        <div class="enc-filters">
            <button class="enc-filter-btn active">Todos</button>
            <button class="enc-filter-btn">Jogadores</button>
            <button class="enc-filter-btn">Edições</button>
            <button class="enc-filter-btn">Times</button>
            <button class="enc-filter-btn">Jogos</button>
        </div>
        <div class="enc-search-wrapper">
            <svg class="enc-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="enc-search" placeholder="Buscar...">
        </div>
    </div>

    <div class="enc-grid">

  
        

    </div>
</section>


<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-inner" id="drawerInner"></div>
</div>


<script src="script.js"></script>



</body>

</html>
